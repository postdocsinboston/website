name: Accessibility check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the site and serves dist/ via the webServer in playwright.config.js.
      - name: Run axe-core accessibility test
        id: axe
        run: npm run test:a11y

      - name: Write axe report (axe-report.md + job summary)
        if: ${{ !cancelled() }}
        run: node scripts/axe-summary.js

      - name: Upload axe report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: axe-report.md
          archive: false
          retention-days: 14
          if-no-files-found: warn
