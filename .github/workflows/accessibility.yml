name: Accessibility check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_violations:
        description: "Allow this manual run to pass even if axe finds violations"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the site and serves dist/ via the webServer in playwright.config.js.
      - name: Run axe-core accessibility test
        id: axe
        run: npm run test:a11y
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_violations }}

      - name: Write axe report (axe-report.md + job summary)
        if: ${{ !cancelled() }}
        run: node scripts/axe-summary.js

      - name: Upload axe report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: axe-report.md
          retention-days: 14
          if-no-files-found: warn
