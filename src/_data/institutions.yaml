# Institutions of the Postdocs in Boston network.
#
# Schema per entry:
#   long_name:  string, required. Full official name — used as the link
#               title/logo alt text, and as the display text if short_name
#               is omitted.
#   short_name: string, optional. Shorter display name shown on the site
#               (e.g. "Mass General"). Falls back to long_name if omitted.
#   abbr:       string, optional acronym (e.g. "MGH"). Not currently
#               displayed on the site.
#   logo:       string, optional URL/path to a logo image.
#   website:    string, optional URL. If given, the entry links out to it.

